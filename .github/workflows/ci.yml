name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
concurrency:
  group: policyweave-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2 # 18.6-alpine3.24
        env:
          POSTGRES_DB: policyweave_test
          POSTGRES_USER: policyweave_ci
          POSTGRES_PASSWORD: policyweave_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U policyweave_ci -d policyweave_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify PostgreSQL policy revision migration
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: policyweave_ci
          PGDATABASE: policyweave_test
          PGPASSWORD: policyweave_ci_password
        run: sh db/tests/policy_revision_runtime.sh
      - name: Verify PostgreSQL concurrent policy writers
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: policyweave_ci
          PGDATABASE: policyweave_test
          PGPASSWORD: policyweave_ci_password
        run: sh db/tests/policy_revision_concurrency.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload exact-head browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: policyweave-browser-evidence
          path: test-results
          if-no-files-found: warn
